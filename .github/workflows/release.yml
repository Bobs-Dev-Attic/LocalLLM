name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/localllm-${RELEASE_TAG}-debug.apk"
      - name: Write release notes
        run: |
          cat > dist/notes.md <<'NOTES'
          LocalLLM Android client.

          ## Install (sideload)

          This is a **debug** build, signed with the standard Android debug key. It
          installs for personal use but is not a Play Store / production release.

          1. Download the `.apk` asset below onto your phone.
          2. Tap it. When Android warns about an unknown source, allow installs for the
             app you downloaded it from (the prompt links to Settings), then Install.
          3. Open the app, enter your LM Studio base URL (e.g.
             `http://192.168.1.10:1234/v1`, using the host computer's LAN IP), test &
             load models, then start chatting.

          Phone and the LM Studio host must be on the same trusted network. See the
          README for network and privacy notes.
          NOTES
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "dist/localllm-${RELEASE_TAG}-debug.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "LocalLLM ${RELEASE_TAG}" \
            --notes-file dist/notes.md
